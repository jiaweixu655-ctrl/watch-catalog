<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手表商品管理 | Prestige Time</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--panel:#171717;--gold:#d7b36a;--line:#403725;--muted:#b8b3a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f2e8;font:15px Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1,h2{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:18px 0}.muted{color:var(--muted);font-size:13px}label{display:block;font-size:13px;color:var(--gold);margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #51452e;border-radius:7px;background:#0d0d0d;color:#fff;font:inherit}textarea{min-height:78px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.btn{border:1px solid var(--gold);background:#241d10;color:#ffe7ad;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:bold}.btn.primary{background:var(--gold);color:#17120a}.btn.danger{border-color:#9e4949;color:#ffcaca;background:#291313}.btn:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;gap:12px;align-items:center}.product img{width:78px;height:78px;object-fit:contain;background:white;border-radius:5px}.product .meta{min-width:0;flex:1}.product .meta strong{display:block;overflow-wrap:anywhere}.status{font-size:12px;color:#a8e6b7}.status.off{color:#ffb3a7}.hidden{display:none!important}.message{padding:10px;border-radius:7px;background:#222;margin:10px 0;white-space:pre-wrap}.thumb{max-width:120px;max-height:120px;object-fit:contain;background:white;display:block;margin-top:8px;border-radius:5px}@media(max-width:650px){.wrap{padding:13px}.row,.products{grid-template-columns:1fr}.panel{padding:13px}}
</style></head><body><div class="wrap">
<div class="head"><div><h1>♕ Prestige Time 商品管理</h1><div class="muted">仅管理员使用 · 保存后会直接提交到 GitHub 并触发网站更新</div></div><a class="btn" href="./index.html">查看网站</a></div>
<section id="loginPanel" class="panel"><h2>管理员登录</h2><p class="muted">使用你在 Cloudflare Worker 中设置的独立管理员账号和密码。</p><form id="loginForm"><label>管理员账号</label><input id="username" autocomplete="username" required><label>管理员密码</label><input id="password" type="password" autocomplete="current-password" required><div class="toolbar"><button class="btn primary" type="submit">登录</button></div></form></section>
<div id="app" class="hidden"><div class="toolbar"><button class="btn primary" id="addBtn">＋ 添加商品</button><button class="btn" id="reloadBtn">重新加载</button><button class="btn danger" id="logoutBtn">退出登录</button><span class="muted" id="count"></span></div><div id="message" class="message hidden"></div>
<section id="editor" class="panel hidden"><h2 id="editorTitle">编辑商品</h2><form id="productForm"><div class="row"><div><label>商品编号（唯一）</label><input id="id" required maxlength="40" placeholder="例如 031"></div><div><label>价格（美元，数字）</label><input id="price" type="number" min="0" step="0.01" required></div></div><div class="row"><div><label>英文名称</label><input id="name_en" required></div><div><label>中文名称</label><input id="name_zh" required></div></div><div class="row"><div><label>英文分类</label><select id="cat_en"><option>Men's Watches</option><option>Women's Watches</option><option>Sports Watches</option><option>Business Watches</option><option>Fashion Watches</option></select></div><div><label>中文分类</label><select id="cat_zh"><option>男士手表</option><option>女士手表</option><option>运动手表</option><option>商务手表</option><option>时尚手表</option></select></div></div><label>型号</label><input id="model" placeholder="例如 116610LV-0002"><div class="row"><div><label>英文介绍</label><textarea id="description_en" placeholder="Short product description"></textarea></div><div><label>中文介绍</label><textarea id="description_zh" placeholder="商品介绍"></textarea></div></div><label>商品图片</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"><div class="muted">支持 JPG、PNG、WebP；建议单张图片不超过 4 MB。选图后会先上传到仓库，再保存商品资料。</div><input id="image" type="text" placeholder="图片路径，例如 images/watch-001.jpg"><img id="preview" class="thumb hidden" alt="图片预览"><label><input id="active" type="checkbox" checked style="width:auto;margin-right:8px">在网站显示此商品（取消勾选即下架，不会删除资料）</label><div class="toolbar"><button class="btn primary" type="submit" id="saveBtn">保存并发布</button><button class="btn" type="button" id="cancelBtn">取消</button></div></form></section>
<section class="panel"><h2>商品列表</h2><p class="muted">点击“编辑”修改内容；“下架/上架”不会删除商品资料。</p><div id="products" class="products"></div></section></div></div>
<script>
const API_BASE = "https://REPLACE-WITH-YOUR-WORKER.workers.dev";
let token = "", items = [], editingOriginalId = null;
const $ = id => document.getElementById(id);
function message(text, bad=false){$('message').textContent=text;$('message').classList.remove('hidden');$('message').style.border=bad?'1px solid #b75b5b':'1px solid #6b8d63';}
async function api(path, options={}){if(API_BASE.includes('REPLACE-WITH-YOUR-WORKER'))throw new Error('请先按部署说明修改 admin.html 中的 API_BASE。');const headers={'Content-Type':'application/json',...(options.headers||{})};if(token)headers.Authorization='Bearer '+token;const res=await fetch(API_BASE+path,{...options,headers});const data=await res.json().catch(()=>({error:'服务器返回了无法识别的内容'}));if(!res.ok)throw new Error(data.error||('请求失败：'+res.status));return data;}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});token=d.token;$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');await load();}catch(err){alert(err.message);}});
async function load(){try{const d=await api('/api/products');items=d.products||[];renderList();$('count').textContent=items.length+' 个商品';message('商品资料已从 GitHub 加载。');}catch(e){message(e.message,true);}}
function renderList(){$('products').innerHTML=items.map((p,i)=>`<div class="product"><img src="${escapeAttr(p.image||'')}" alt="" onerror="this.style.visibility='hidden'"><div class="meta"><strong>${escapeHtml(p.name_zh||p.name_en||'未命名商品')}</strong><div class="muted">${escapeHtml(p.model||p.id)} · US$${Number(p.price||0).toFixed(2)}</div><div class="status ${p.active===false?'off':''}">${p.active===false?'已下架':'网站展示中'}</div><div class="toolbar"><button class="btn" onclick="editAt(${i})">编辑</button><button class="btn" onclick="toggleAt(${i})">${p.active===false?'上架':'下架'}</button></div></div></div>`).join('');}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function escapeAttr(s){return escapeHtml(s);}
function openEditor(p=null){$('editor').classList.remove('hidden');$('editorTitle').textContent=p?'编辑商品':'添加商品';$('productForm').reset();$('image').value='';$('preview').classList.add('hidden');$('active').checked=true;editingOriginalId=p?p.id:null;for(const k of ['id','price','name_en','name_zh','cat_en','cat_zh','model','description_en','description_zh','image'])if(p&&p[k]!==undefined&&$(k))$(k).value=p[k];if(p&&p.active===false)$('active').checked=false;if(p&&p.image){$('preview').src=p.image;$('preview').classList.remove('hidden');}$('editor').scrollIntoView({behavior:'smooth'});}
window.editAt=i=>openEditor(items[i]);window.toggleAt=async i=>{const p={...items[i],active:items[i].active===false};const next=items.map((x,j)=>j===i?p:x);try{await saveAll(next);message(p.active?'商品已上架。':'商品已下架。');}catch(e){message(e.message,true);}};
$('addBtn').onclick=()=>openEditor();$('reloadBtn').onclick=load;$('logoutBtn').onclick=()=>{token='';items=[];$('app').classList.add('hidden');$('loginPanel').classList.remove('hidden');};$('cancelBtn').onclick=()=>$('editor').classList.add('hidden');
$('imageFile').addEventListener('change',async()=>{const f=$('imageFile').files[0];if(!f)return;if(f.size>4*1024*1024){alert('图片超过 4 MB，请先压缩后再上传。');$('imageFile').value='';return;}try{const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});$('preview').src=dataUrl;$('preview').classList.remove('hidden');$('image').dataset.pending=dataUrl;$('image').value='（保存时上传）';}catch(e){alert('无法读取图片');}});
async function saveAll(products){const d=await api('/api/products',{method:'PUT',body:JSON.stringify({products})});items=d.products||products;renderList();$('count').textContent=items.length+' 个商品';}
$('productForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('saveBtn');btn.disabled=true;try{let image=$('image').value.trim();const dataUrl=$('image').dataset.pending;if(dataUrl){const file=$('imageFile').files[0];const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path='images/watch-'+$('id').value.trim()+'.'+(ext||'jpg');const up=await api('/api/upload',{method:'POST',body:JSON.stringify({path,dataUrl})});image=up.path;delete $('image').dataset.pending;}
const p={id:$('id').value.trim(),price:Number($('price').value),name_en:$('name_en').value.trim(),name_zh:$('name_zh').value.trim(),cat_en:$('cat_en').value,cat_zh:$('cat_zh').value,model:$('model').value.trim(),description_en:$('description_en').value.trim(),description_zh:$('description_zh').value.trim(),image,active:$('active').checked};if(!p.id||!p.name_en||!p.name_zh||!Number.isFinite(p.price)||p.price<0)throw new Error('请填写编号、名称和有效价格。');const next=[...items];const ix=next.findIndex(x=>String(x.id)===String(editingOriginalId??p.id));if(editingOriginalId!==null&&String(editingOriginalId)!==String(p.id)&&next.some(x=>String(x.id)===String(p.id)))throw new Error('商品编号重复，请使用唯一编号。');if(ix>=0)next[ix]=p;else{if(next.some(x=>String(x.id)===String(p.id)))throw new Error('商品编号重复，请使用唯一编号。');next.push(p);}await saveAll(next);$('editor').classList.add('hidden');message('保存成功！GitHub 已收到更新，网站通常会在 1–5 分钟内发布。');}catch(err){message(err.message,true);}finally{btn.disabled=false;}});
</script></body></html>
