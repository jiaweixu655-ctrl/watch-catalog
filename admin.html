<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手表商品管理 | Prestige Time</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--panel:#171717;--gold:#d7b36a;--line:#403725;--muted:#b8b3a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f2e8;font:15px Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1,h2{color:var(--gold)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:18px 0}.muted{color:var(--muted);font-size:13px}label{display:block;font-size:13px;color:var(--gold);margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #51452e;border-radius:7px;background:#0d0d0d;color:#fff;font:inherit}textarea{min-height:78px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.btn{border:1px solid var(--gold);background:#241d10;color:#ffe7ad;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:bold;text-decoration:none;font-size:14px}.btn.primary{background:var(--gold);color:#17120a}.btn.danger{border-color:#9e4949;color:#ffcaca;background:#291313}.btn:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}.toolbar input,.toolbar select{width:auto;flex:1;min-width:140px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;gap:12px;align-items:center}.product.off{opacity:.6}.product img{width:78px;height:78px;object-fit:contain;background:#fff;border-radius:5px}.product .meta{min-width:0;flex:1}.product .meta strong{display:block;overflow-wrap:anywhere}.product .toolbar{margin:8px 0 0}.status{font-size:12px;color:#a8e6b7}.status.off{color:#ffb3a7}.hidden{display:none!important}.message{position:sticky;top:8px;z-index:9;padding:10px;border-radius:7px;background:#222;margin:10px 0;white-space:pre-wrap}.thumb{max-width:120px;max-height:120px;object-fit:contain;background:#fff;display:block;margin-top:8px;border-radius:5px}@media(max-width:650px){.wrap{padding:13px}.row,.products{grid-template-columns:1fr}.panel{padding:13px}}
</style></head><body><div class="wrap">
<div class="head"><div><h1>♕ Prestige Time 商品管理</h1><div class="muted">仅管理员使用 · 保存后会直接提交到 GitHub 并触发网站更新</div></div><a class="btn" href="./index.html" target="_blank">查看网站</a></div>
<section id="loginPanel" class="panel"><h2>管理员登录</h2><p class="muted">使用你在 Cloudflare Worker 中设置的管理员账号和密码。</p><form id="loginForm"><label>管理员账号</label><input id="username" autocomplete="username" required><label>管理员密码</label><input id="password" type="password" autocomplete="current-password" required><div class="toolbar"><button class="btn primary" type="submit" id="loginBtn">登录</button></div></form></section>
<div id="app" class="hidden"><div class="toolbar"><button class="btn primary" id="addBtn">＋ 添加商品</button><button class="btn" id="reloadBtn">重新加载</button><button class="btn danger" id="logoutBtn">退出登录</button><span class="muted" id="count"></span></div><div id="message" class="message hidden"></div>
<section id="editor" class="panel hidden"><h2 id="editorTitle">编辑商品</h2><form id="productForm"><div class="row"><div><label>商品编号（唯一，已自动生成）</label><input id="id" required maxlength="40"></div><div><label>价格（美元）</label><input id="price" type="number" min="0" step="0.01" required inputmode="decimal"></div></div><div class="row"><div><label>英文名称</label><input id="name_en" required></div><div><label>中文名称</label><input id="name_zh" required></div></div><div class="row"><div><label>英文分类（可选已有，或直接输入新分类）</label><input id="cat_en" list="dl_en" required placeholder="例如 Men's Watches"></div><div><label>中文分类</label><input id="cat_zh" list="dl_zh" required placeholder="例如 男士手表"></div></div><datalist id="dl_en"></datalist><datalist id="dl_zh"></datalist><label>型号</label><input id="model" placeholder="例如 116610LV-0002"><div class="row"><div><label>英文介绍</label><textarea id="description_en"></textarea></div><div><label>中文介绍</label><textarea id="description_zh"></textarea></div></div><label>商品图片（选图后自动压缩，不限大小）</label><input id="imageFile" type="file" accept="image/*"><input id="image" type="text" placeholder="图片路径（选图后自动生成，也可手动填写）"><img id="preview" class="thumb hidden" alt="图片预览"><label><input id="active" type="checkbox" checked style="width:auto;margin-right:8px">在网站显示此商品（取消勾选即下架，不会删除资料）</label><div class="toolbar"><button class="btn primary" type="submit" id="saveBtn">保存并发布</button><button class="btn" type="button" id="cancelBtn">取消</button><button class="btn danger hidden" type="button" id="delBtn">删除此商品</button></div></form></section>
<section class="panel"><h2>分类管理</h2><p class="muted">网站首页的分类栏会根据商品自动生成：给商品填写新分类就会多出一个按钮，某个分类下没有上架商品时按钮会自动消失。这里可以重命名分类（会同步修改该分类下所有商品）。</p><div id="cats" class="products"></div></section><section class="panel"><h2>商品列表</h2><div class="toolbar"><input id="search" type="search" placeholder="搜索名称、型号、编号"><select id="filterCat"><option value="">全部分类</option></select></div><div id="products" class="products"></div></section></div></div>
<script>
const API_BASE = "https://watch-catalog-admin-api.jiaweixu655.workers.dev";
const $ = id => document.getElementById(id);
const store = {get(){try{return sessionStorage.getItem('tk')||''}catch(e){return ''}},set(v){try{v?sessionStorage.setItem('tk',v):sessionStorage.removeItem('tk')}catch(e){}}};
let token = store.get(), items = [], editingId = null, pending = null, timer;
function message(t,bad=false){const m=$('message');m.textContent=t;m.classList.remove('hidden');m.style.border=bad?'1px solid #b75b5b':'1px solid #6b8d63';clearTimeout(timer);if(!bad)timer=setTimeout(()=>m.classList.add('hidden'),6000);}
async function api(path,options={}){const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const res=await fetch(API_BASE+path,{...options,headers});const data=await res.json().catch(()=>({error:'服务器返回了无法识别的内容'}));if(res.status===401&&token&&path!=='/api/login'){logout();throw new Error('登录已过期，请重新登录。');}if(!res.ok)throw new Error(data.error||('请求失败：'+res.status));return data;}
function showApp(){$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');}
function logout(){token='';store.set('');items=[];$('app').classList.add('hidden');$('editor').classList.add('hidden');$('loginPanel').classList.remove('hidden');}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='登录中…';try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});token=d.token;store.set(token);$('password').value='';showApp();await load();}catch(err){alert(err.message);}finally{b.disabled=false;b.textContent='登录';}});
async function load(){try{const d=await api('/api/products');items=d.products||[];refresh();message('商品资料已从 GitHub 加载。');}catch(e){message(e.message,true);}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cats(){const m=new Map();items.forEach(p=>{if(p.cat_en){const c=m.get(p.cat_en)||{en:p.cat_en,zh:p.cat_zh||'',n:0};c.n++;m.set(p.cat_en,c)}});return [...m.values()];}
function renderCats(){const c=cats();$('dl_en').innerHTML=c.map(x=>`<option value="${esc(x.en)}">`).join('');$('dl_zh').innerHTML=c.map(x=>`<option value="${esc(x.zh)}">`).join('');$('cats').innerHTML=c.map(x=>`<div class="product"><div class="meta"><strong>${esc(x.en)} · ${esc(x.zh)}</strong><div class="muted">${x.n} 个商品</div></div><button class="btn" data-ren="${esc(x.en)}">重命名</button></div>`).join('')||'<div class="muted">还没有分类，添加商品时填写分类即可。</div>';}
$('cats').addEventListener('click',async e=>{const b=e.target.closest('[data-ren]');if(!b)return;const c=cats().find(x=>x.en===b.dataset.ren);if(!c)return;const en=prompt('新的英文分类名：',c.en);if(en===null)return;const zh=prompt('新的中文分类名：',c.zh);if(zh===null)return;if(!en.trim()||!zh.trim())return alert('名称不能为空。');try{await saveAll(items.map(p=>p.cat_en===c.en?{...p,cat_en:en.trim(),cat_zh:zh.trim()}:p));message('分类已更新，网站稍后会同步显示。');}catch(err){message(err.message,true);}});
function refresh(){renderCats();const sel=$('filterCat'),cur=sel.value,cats=[...new Set(items.map(p=>p.cat_zh).filter(Boolean))];sel.innerHTML='<option value="">全部分类</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');sel.value=cats.includes(cur)?cur:'';renderList();}
function renderList(){const q=$('search').value.trim().toLowerCase(),cat=$('filterCat').value;const shown=items.map((p,i)=>({p,i})).filter(({p})=>(!cat||p.cat_zh===cat)&&(!q||[p.id,p.model,p.name_en,p.name_zh].join(' ').toLowerCase().includes(q)));$('count').textContent=`共 ${items.length} 个，下架 ${items.filter(p=>p.active===false).length} 个`+(shown.length!==items.length?`，当前显示 ${shown.length} 个`:'');$('products').innerHTML=shown.map(({p,i})=>`<div class="product ${p.active===false?'off':''}"><img src="${esc(p.image||'')}" alt="" onerror="this.style.visibility='hidden'"><div class="meta"><strong>${esc(p.name_zh||p.name_en||'未命名商品')}</strong><div class="muted">#${esc(p.id)} · ${esc(p.model||'')} · US$${Number(p.price||0).toFixed(2)}</div><div class="status ${p.active===false?'off':''}">${p.active===false?'已下架':'网站展示中'}</div><div class="toolbar"><button class="btn" data-act="edit" data-i="${i}">编辑</button><button class="btn" data-act="toggle" data-i="${i}">${p.active===false?'上架':'下架'}</button></div></div></div>`).join('')||'<div class="muted">没有符合条件的商品。</div>';}
$('search').addEventListener('input',renderList);$('filterCat').addEventListener('change',renderList);
$('products').addEventListener('click',async e=>{const b=e.target.closest('button[data-act]');if(!b)return;const i=+b.dataset.i;if(b.dataset.act==='edit')return openEditor(items[i]);b.disabled=true;const p={...items[i],active:items[i].active===false};try{await saveAll(items.map((x,j)=>j===i?p:x));message(p.active?'商品已上架。':'商品已下架。');}catch(err){message(err.message,true);}});
function nextId(){const n=items.map(p=>parseInt(p.id,10)).filter(Number.isFinite);return String((n.length?Math.max(...n):0)+1).padStart(3,'0');}
function openEditor(p=null){$('productForm').reset();pending=null;$('imageFile').value='';$('editor').classList.remove('hidden');$('editorTitle').textContent=p?'编辑商品：'+(p.name_zh||p.id):'添加商品';$('delBtn').classList.toggle('hidden',!p);editingId=p?p.id:null;$('id').value=p?p.id:nextId();for(const k of ['price','name_en','name_zh','cat_en','cat_zh','model','description_en','description_zh','image'])if(p&&p[k]!==undefined)$(k).value=p[k];$('active').checked=!(p&&p.active===false);if(p&&p.image){$('preview').src=p.image;$('preview').classList.remove('hidden');}else $('preview').classList.add('hidden');$('editor').scrollIntoView({behavior:'smooth'});$('name_zh').focus({preventScroll:true});}
$('cat_en').addEventListener('change',()=>{const c=cats().find(x=>x.en===$('cat_en').value.trim());if(c&&c.zh)$('cat_zh').value=c.zh;});
$('addBtn').onclick=()=>openEditor();$('reloadBtn').onclick=load;$('logoutBtn').onclick=logout;$('cancelBtn').onclick=()=>$('editor').classList.add('hidden');
function compress(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.85));};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('无法读取这张图片，请换一张。'));};im.src=u;});}
$('imageFile').addEventListener('change',async()=>{const f=$('imageFile').files[0];if(!f)return;try{pending=await compress(f);$('preview').src=pending;$('preview').classList.remove('hidden');$('image').value='（保存时自动上传）';}catch(e){pending=null;alert(e.message);}});
async function saveAll(products){const d=await api('/api/products',{method:'PUT',body:JSON.stringify({products})});items=d.products||products;refresh();}
$('productForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('saveBtn');btn.disabled=true;btn.textContent='保存中…';try{let image=$('image').value.trim();if(pending){const path='images/watch-'+$('id').value.trim().replace(/[^a-zA-Z0-9._-]/g,'-')+'.jpg';await api('/api/upload',{method:'POST',body:JSON.stringify({path,dataUrl:pending})});image=path;pending=null;}
const p={id:$('id').value.trim(),price:Number($('price').value),name_en:$('name_en').value.trim(),name_zh:$('name_zh').value.trim(),cat_en:$('cat_en').value.trim(),cat_zh:$('cat_zh').value.trim(),model:$('model').value.trim(),description_en:$('description_en').value.trim(),description_zh:$('description_zh').value.trim(),image,active:$('active').checked};if(!p.id||!p.name_en||!p.name_zh||!Number.isFinite(p.price)||p.price<0)throw new Error('请填写编号、名称和有效价格。');const next=[...items],ix=editingId===null?-1:next.findIndex(x=>String(x.id)===String(editingId));if(next.some((x,j)=>j!==ix&&String(x.id)===p.id))throw new Error('商品编号重复，请使用唯一编号。');if(ix>=0)next[ix]=p;else next.push(p);await saveAll(next);$('editor').classList.add('hidden');message('保存成功！GitHub 已收到更新，网站通常会在 1–5 分钟内发布。');}catch(err){message(err.message,true);}finally{btn.disabled=false;btn.textContent='保存并发布';}});
$('delBtn').onclick=async()=>{if(editingId===null||!confirm('确定永久删除这个商品吗？（只想隐藏的话请用“下架”）'))return;try{await saveAll(items.filter(x=>String(x.id)!==String(editingId)));$('editor').classList.add('hidden');message('商品已删除。');}catch(err){message(err.message,true);}};
if(token){showApp();load();}
</script></body></html>
